<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WorldBox AI - Fixed Touch</title>
    <style>
        body, html {
            margin: 0; padding: 0; overflow: hidden;
            background-color: #0d1b2a; width: 100%; height: 100%;
            user-select: none; touch-action: none;
            font-family: sans-serif;
        }
        canvas { display: block; width: 100vw; height: 100vh; }

        /* Нижнее меню */
        .bottom-menu {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 30, 45, 0.9);
            border: 2px solid #415a77;
            border-radius: 14px;
            padding: 10px 20px;
            display: flex;
            gap: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        /* Кнопки-иконки */
        .tool-btn {
            background: #1b263b;
            border: 2px solid #778da9;
            border-radius: 10px;
            width: 55px;
            height: 55px;
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .icon-land {
            width: 32px; height: 32px;
            background: #4ade80;
            box-shadow: inset -6px -6px 0 0 #fef08a, 0 0 0 2px #22c55e;
            border-radius: 4px;
        }

        .icon-water {
            width: 32px; height: 32px;
            background: #1d4ed8;
            box-shadow: inset 6px 6px 0 0 #3b82f6, 0 0 0 2px #1e40af;
            border-radius: 4px;
        }

        .icon-spawn {
            width: 32px; height: 32px;
            background: #f87171;
            border-radius: 4px;
            box-shadow: inset 0 12px 0 0 #ffedd5, 0 0 0 2px #991b1b;
        }

        .tool-btn.active {
            background: #2e3d52;
            border-color: #f1c40f;
            transform: scale(1.08);
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.4);
        }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div class="bottom-menu">
        <button class="tool-btn active" id="btn-land" onclick="selectTool('land')">
            <div class="icon-land"></div>
        </button>
        <button class="tool-btn" id="btn-water" onclick="selectTool('water')">
            <div class="icon-water"></div>
        </button>
        <button class="tool-btn" id="btn-spawn" onclick="selectTool('spawn')">
            <div class="icon-spawn"></div>
        </button>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const COLS = 80; 
    const ROWS = 80; 
    let tileSize = 1; 
    let currentTool = 'land'; 

    let world = [];
    for (let x = 0; x < COLS; x++) {
        world[x] = [];
        for (let y = 0; y < ROWS; y++) world[x][y] = 0; 
    }

    let humans = [];

    const COLORS = {
        0: '#1d4ed8', // Вода
        1: '#4ade80', // Земля
        2: '#fef08a'  // Песок
    };

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        tileSize = Math.min(canvas.width / COLS, canvas.height / ROWS);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function updateBeaches() {
        for (let x = 0; x < COLS; x++) {
            for (let y = 0; y < ROWS; y++) {
                if (world[x][y] === 0) {
                    let hasLandNearby = false;
                    for (let dx = -1; dx <= 1; dx++) {
                        for (let dy = -1; dy <= 1; dy++) {
                            let nx = x + dx; let ny = y + dy;
                            if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                                if (world[nx][ny] === 1) hasLandNearby = true;
                            }
                        }
                    }
                    if (hasLandNearby) world[x][y] = 2;
                }
                else if (world[x][y] === 2) {
                    let hasLandNearby = false;
                    for (let dx = -1; dx <= 1; dx++) {
                        for (let dy = -1; dy <= 1; dy++) {
                            let nx = x + dx; let ny = y + dy;
                            if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                                if (world[nx][ny] === 1) hasLandNearby = true;
                            }
                        }
                    }
                    if (!hasLandNearby) world[x][y] = 0;
                }
            }
        }
    }

    class Human {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.color = '#ffffff';
        }

        update() {
            let dx = Math.floor(Math.random() * 3) - 1;
            let dy = Math.floor(Math.random() * 3) - 1;
            let newX = this.x + dx;
            let newY = this.y + dy;

            if (newX >= 0 && newX < COLS && newY >= 0 && newY < ROWS) {
                if (world[newX][newY] === 1 || world[newX][newY] === 2) {
                    this.x = newX;
                    this.y = newY;
                }
            }
        }

        draw(offsetX, offsetY) {
            ctx.fillStyle = this.color;
            ctx.fillRect(offsetX + this.x * tileSize + 1, offsetY + this.y * tileSize + 1, tileSize - 1, tileSize - 1);
        }
    }

    function selectTool(tool) {
        currentTool = tool;
        document.getElementById('btn-land').classList.remove('active');
        document.getElementById('btn-water').classList.remove('active');
        document.getElementById('btn-spawn').classList.remove('active');
        
        if(tool === 'land') document.getElementById('btn-land').classList.add('active');
        if(tool === 'water') document.getElementById('btn-water').classList.add('active');
        if(tool === 'spawn') document.getElementById('btn-spawn').classList.add('active');
    }

    function useTool(screenX, screenY) {
        const offsetX = (canvas.width - COLS * tileSize) / 2;
        const offsetY = (canvas.height - ROWS * tileSize) / 2;
        const targetX = Math.floor((screenX - offsetX) / tileSize);
        const targetY = Math.floor((screenY - offsetY) / tileSize);

        if (targetX < 0 || targetX >= COLS || targetY < 0 || targetY >= ROWS) return;

        if (currentTool === 'spawn') {
            if (world[targetX][targetY] === 1 || world[targetX][targetY] === 2) {
                humans.push(new Human(targetX, targetY));
            }
            return;
        }

        const brushRadius = 3; 
        for (let dx = -brushRadius; dx <= brushRadius; dx++) {
            for (let dy = -brushRadius; dy <= brushRadius; dy++) {
                const nx = targetX + dx;
                const ny = targetY + dy;
                if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                    if (dx*dx + dy*dy <= brushRadius*brushRadius) {
                        if (currentTool === 'land') world[nx][ny] = 1;
                        else if (currentTool === 'water') {
                            world[nx][ny] = 0;
                            humans = humans.filter(h => !(h.x === nx && h.y === ny));
                        }
                    }
                }
            }
        }
        updateBeaches(); 
    }

    function gameLoop() {
        for (let human of humans) {
            human.update();
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const offsetX = (canvas.width - COLS * tileSize) / 2;
        const offsetY = (canvas.height - ROWS * tileSize) / 2;

        for (let x = 0; x < COLS; x++) {
            for (let y = 0; y < ROWS; y++) {
                ctx.fillStyle = COLORS[world[x][y]];
                ctx.fillRect(offsetX + x * tileSize, offsetY + y * tileSize, tileSize + 0.5, tileSize + 0.5);
            }
        }

        for (let human of humans) {
            human.draw(offsetX, offsetY);
        }

        requestAnimationFrame(gameLoop);
    }

    let isDrawing = false;
    
    // Исправленные обработчики для мыши
    canvas.addEventListener('mousedown', (e) => { isDrawing = true; useTool(e.clientX, e.clientY); });
    canvas.addEventListener('mousemove', (e) => { if (isDrawing && currentTool !== 'spawn') useTool(e.clientX, e.clientY); });
    window.addEventListener('mouseup', () => isDrawing = false);

    // ПОЛНОСТЬЮ ИСПРАВЛЕННЫЕ мобильные тач-события
    canvas.addEventListener('touchstart', (e) => { 
        isDrawing = true; 
        const touch = e.touches[0]; // Берем первый палец
        useTool(touch.clientX, touch.clientY); 
    });
    canvas.addEventListener('touchmove', (e) => { 
        if (isDrawing && currentTool !== 'spawn') {
            const touch = e.touches[0];
            useTool(touch.clientX, touch.clientY); 
        }
    });
    canvas.addEventListener('touchend', () => isDrawing = false);

    gameLoop();
</script>
</body>
</html>
